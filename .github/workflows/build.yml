# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on: ['push', 'pull_request']

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        node-version: ['22.23.4', '24.22.1']
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - name: Verify GitHub Actions Node.js runtime
        run: |
          runner_root="$(dirname "$(dirname "$(readlink -f /proc/$PPID/exe)")")"
          "$runner_root/externals/node24/bin/node" -e '
            console.log("GitHub Actions runtime:", process.version, process.execPath);
            const [major, minor, patch] = process.versions.node.split(".").map(Number);
            if (major !== 24 || minor < 22 || (minor === 22 && patch < 1)) {
              throw new Error("GitHub Actions requires Node.js >=24.22.1 on the Node.js 24 line");
            }
          '
      - uses: actions/checkout@v7.0.1
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Report build runtime
        run: |
          node --version
          npm --version
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: MODE=prod npm run build
      - run: npx playwright install
      - run: npm run test
