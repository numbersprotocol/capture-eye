name: Production Release
on:
  push:
    branches:
      - main

jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Report GitHub-managed Actions Node.js runtime
        run: |
          runner_root="$(dirname "$(dirname "$(readlink -f /proc/$PPID/exe)")")"
          "$runner_root/externals/node24/bin/node" -e '
            console.log("GitHub Actions runtime:", process.version, process.execPath);
            const [major, minor, patch] = process.versions.node.split(".").map(Number);
            if (major !== 24 || minor < 22 || (minor === 22 && patch < 1)) {
              console.warn("::warning::GitHub-managed Action runtime is below Node.js 24.22.1; setup-node only secures the build runtime.");
            }
          '
      - uses: actions/checkout@v7.0.1
      - name: Check version changes
        id: check
        uses: EndBug/version-check@v3.0.0

  publish-github:
    needs: version-check
    if: needs.version-check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Report GitHub-managed Actions Node.js runtime
        run: |
          runner_root="$(dirname "$(dirname "$(readlink -f /proc/$PPID/exe)")")"
          "$runner_root/externals/node24/bin/node" -e '
            console.log("GitHub Actions runtime:", process.version, process.execPath);
            const [major, minor, patch] = process.versions.node.split(".").map(Number);
            if (major !== 24 || minor < 22 || (minor === 22 && patch < 1)) {
              console.warn("::warning::GitHub-managed Action runtime is below Node.js 24.22.1; setup-node only secures the build runtime.");
            }
          '
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'
          registry-url: https://npm.pkg.github.com/
          scope: '@numbersprotocol'
      - name: Verify build runtime
        run: |
          node --version
          test "$(node --version)" = "v24.22.1"
          npm --version
      - name: Install dependencies
        run: npm ci
      - name: Build the project
        run: MODE=prod npm run build
      - name: Deploy to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    needs: version-check
    if: needs.version-check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Report GitHub-managed Actions Node.js runtime
        run: |
          runner_root="$(dirname "$(dirname "$(readlink -f /proc/$PPID/exe)")")"
          "$runner_root/externals/node24/bin/node" -e '
            console.log("GitHub Actions runtime:", process.version, process.execPath);
            const [major, minor, patch] = process.versions.node.split(".").map(Number);
            if (major !== 24 || minor < 22 || (minor === 22 && patch < 1)) {
              console.warn("::warning::GitHub-managed Action runtime is below Node.js 24.22.1; setup-node only secures the build runtime.");
            }
          '
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'
          registry-url: 'https://registry.npmjs.org'
          scope: '@numbersprotocol'
      - name: Verify build runtime
        run: |
          node --version
          test "$(node --version)" = "v24.22.1"
          npm --version
      - name: Install dependencies
        run: npm ci
      - name: Build the project
        run: MODE=prod npm run build
      - name: Deploy to NPM registry
        run: npm publish

  purge-cdn-cache:
    needs: publish-npm
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Send GET request to purge jsdelivr cache
        run: |
          curl --fail-with-body -X GET "https://purge.jsdelivr.net/npm/@numbersprotocol/capture-eye@latest/dist/capture-eye.bundled.js"

  publish-s3:
    needs: version-check
    if: needs.version-check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report GitHub-managed Actions Node.js runtime
        run: |
          runner_root="$(dirname "$(dirname "$(readlink -f /proc/$PPID/exe)")")"
          "$runner_root/externals/node24/bin/node" -e '
            console.log("GitHub Actions runtime:", process.version, process.execPath);
            const [major, minor, patch] = process.versions.node.split(".").map(Number);
            if (major !== 24 || minor < 22 || (minor === 22 && patch < 1)) {
              console.warn("::warning::GitHub-managed Action runtime is below Node.js 24.22.1; setup-node only secures the build runtime.");
            }
          '
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'
      - name: Verify build runtime
        run: |
          node --version
          test "$(node --version)" = "v24.22.1"
          npm --version
      - name: Install dependencies
        run: npm ci
      - name: Build the project
        run: MODE=prod npm run build
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Deploy to S3
        run: sh -c scripts/deploy-release.sh

  create-release:
    needs: [version-check, publish-github, publish-npm, publish-s3]
    runs-on: ubuntu-latest
    if: needs.version-check.outputs.changed == 'true'
    steps:
      - name: Report GitHub-managed Actions Node.js runtime
        run: |
          runner_root="$(dirname "$(dirname "$(readlink -f /proc/$PPID/exe)")")"
          "$runner_root/externals/node24/bin/node" -e '
            console.log("GitHub Actions runtime:", process.version, process.execPath);
            const [major, minor, patch] = process.versions.node.split(".").map(Number);
            if (major !== 24 || minor < 22 || (minor === 22 && patch < 1)) {
              console.warn("::warning::GitHub-managed Action runtime is below Node.js 24.22.1; setup-node only secures the build runtime.");
            }
          '
      - uses: actions/checkout@v7.0.1
      - name: Create Release
        uses: softprops/action-gh-release@v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Release ${{ needs.version-check.outputs.version }}
          tag_name: ${{ needs.version-check.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
